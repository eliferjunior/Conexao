<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Konektra">
  <defs>
    <linearGradient id="kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset=".55" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#f72585"/>
    </linearGradient>
    <radialGradient id="kglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00f5d4" stop-opacity=".7"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#kglow)" opacity=".35"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#kg)" stroke-width="1.2" opacity=".65"/>
  <!-- abstract K made of a spine + two arrows -->
  <g fill="none" stroke="url(#kg)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14 L20 50"/>
    <path d="M20 32 L42 14"/>
    <path d="M20 32 L42 50"/>
  </g>
  <!-- connection nodes -->
  <g fill="#00f5d4">
    <circle cx="20" cy="14" r="2.2"/>
    <circle cx="20" cy="50" r="2.2"/>
  </g>
  <g fill="#f72585">
    <circle cx="42" cy="14" r="2.2"/>
    <circle cx="42" cy="50" r="2.2"/>
  </g>
  <circle cx="20" cy="32" r="2.6" fill="#4cc9f0"/>
</svg>
